name: Java CI with Maven

on: [push, pull_request]

jobs:
  build:
    name: Test on ${{ matrix.os }} (Java ${{ matrix.java-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java-version: [25]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      # jar-with-dependencies is named explicitly because on macOS the
      # OS-activated package-mac profile would otherwise switch it off, and
      # with it the extra resource directories the shipped jar is built from.
      - name: Run tests
        run: mvn -B test -P jar-with-dependencies
